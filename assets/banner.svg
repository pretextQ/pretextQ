<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="pretextQ banner: Build the agent. Ground it in facts. Prove it works.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101d31"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.12" cy="0" r="0.9">
      <stop offset="0" stop-color="#2f6fb8" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2f6fb8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRed" cx="0.98" cy="1" r="0.8">
      <stop offset="0" stop-color="#e05555" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#e05555" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="18" fill="url(#glowBlue)"/>
  <rect width="1200" height="360" rx="18" fill="url(#glowRed)"/>
  <rect width="1200" height="360" rx="18" fill="url(#grid)"/>

  <text x="60" y="66" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="600" letter-spacing="5" fill="#8fa7c2">PRETEXTQ / AI AGENT &amp; TEST AUTOMATION ENGINEER</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="58" y="146" font-size="50" font-weight="900" fill="#f4f8fc" letter-spacing="0.5">BUILD THE AGENT.</text>
    <text x="58" y="204" font-size="50" font-weight="900" fill="#f4f8fc" letter-spacing="0.5">GROUND IT IN FACTS.</text>
    <text x="58" y="262" font-size="50" font-weight="900" fill="#f4f8fc" letter-spacing="0.5">PROVE IT WORKS.</text>
    <text x="60" y="300" font-size="17" fill="#93a4bd">Production-grade agent frameworks, RAG pipelines and evidence-driven test automation.</text>
  </g>

  <g stroke="#5b7290" stroke-width="2" stroke-opacity="0.65">
    <line x1="888" y1="122" x2="934" y2="164"/>
    <line x1="984" y1="206" x2="1004" y2="242"/>
  </g>

  <circle cx="860" cy="100" r="36" fill="#0d1526" stroke="#4aa3ff" stroke-width="3"/>
  <circle cx="860" cy="100" r="7" fill="#4aa3ff"/>
  <text x="910" y="97" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" letter-spacing="0.5" fill="#ffffff">ATLAS-CLAW</text>
  <text x="910" y="117" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" letter-spacing="2" fill="#4aa3ff">AGENT FRAMEWORK</text>

  <circle cx="958" cy="182" r="33" fill="#0d1526" stroke="#35d07f" stroke-width="3"/>
  <circle cx="958" cy="182" r="6.5" fill="#35d07f"/>
  <text x="1003" y="179" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" letter-spacing="0.5" fill="#ffffff">GRAPHSCHOLAR</text>
  <text x="1003" y="199" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" letter-spacing="2" fill="#35d07f">RAG KNOWLEDGE</text>

  <circle cx="1026" cy="264" r="30" fill="#0d1526" stroke="#f0655f" stroke-width="3"/>
  <circle cx="1026" cy="264" r="6" fill="#f0655f"/>
  <text x="1068" y="261" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" letter-spacing="0.5" fill="#ffffff">API-TEST-FW</text>
  <text x="1068" y="281" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" fill="#f0655f">VERIFICATION</text>

  <text x="1140" y="338" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="12" letter-spacing="3" fill="#7d8ba1">FRAMEWORK — KNOWLEDGE — VERIFICATION</text>
</svg>
