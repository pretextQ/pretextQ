<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">pretextQ — AI Agent &amp; Test Automation Engineer</title>
  <desc id="desc">A visual map connecting atlas-claw, GraphScholarV1, and api-auto-test-framework across framework, knowledge, and verification.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#24304a" stroke-width="1" opacity="0.42"/>
    </pattern>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4cc9f0"/>
      <stop offset="0.5" stop-color="#7bd88f"/>
      <stop offset="1" stop-color="#ff6b6b"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1280" height="420" rx="24" fill="#0b1020"/>
  <rect width="1280" height="420" rx="24" fill="url(#grid)"/>

  <circle cx="1110" cy="64" r="120" fill="#4cc9f0" opacity="0.07" filter="url(#softGlow)"/>
  <circle cx="1030" cy="370" r="150" fill="#ff6b6b" opacity="0.06" filter="url(#softGlow)"/>

  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="64" y="72" fill="#9aaccc" font-size="16" font-weight="700" letter-spacing="4">PRETEXTQ / AI AGENT &amp; TEST AUTOMATION ENGINEER</text>
    <text x="64" y="152" fill="#f7f9ff" font-size="52" font-weight="800" letter-spacing="-1.2">BUILD THE AGENT.</text>
    <text x="64" y="216" fill="#f7f9ff" font-size="52" font-weight="800" letter-spacing="-1.2">GROUND IT IN FACTS.</text>
    <text x="64" y="280" fill="#f7f9ff" font-size="52" font-weight="800" letter-spacing="-1.2">PROVE IT WORKS.</text>
    <text x="66" y="330" fill="#9aaccc" font-size="18">Production-grade agent frameworks, RAG pipelines and evidence-driven test automation.</text>
  </g>

  <g transform="translate(760 70)" font-family="Segoe UI, Inter, Arial, sans-serif">
    <path d="M 52 52 C 110 52, 104 132, 162 132 S 214 212, 272 212" fill="none" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/>
    <path d="M 52 52 C 130 52, 186 212, 272 212" fill="none" stroke="url(#line)" stroke-width="2" stroke-linecap="round" opacity="0.35"/>

    <g>
      <circle cx="52" cy="52" r="44" fill="#111a30" stroke="#4cc9f0" stroke-width="3"/>
      <circle cx="52" cy="52" r="8" fill="#4cc9f0"/>
      <text x="112" y="44" fill="#f7f9ff" font-size="20" font-weight="800">ATLAS-CLAW</text>
      <text x="112" y="68" fill="#8fbdd0" font-size="14" font-weight="700" letter-spacing="2">AGENT FRAMEWORK</text>
    </g>

    <g>
      <circle cx="162" cy="132" r="44" fill="#111a30" stroke="#7bd88f" stroke-width="3"/>
      <circle cx="162" cy="132" r="8" fill="#7bd88f"/>
      <text x="222" y="124" fill="#f7f9ff" font-size="20" font-weight="800">GRAPHSCHOLAR</text>
      <text x="222" y="148" fill="#a8d9b2" font-size="14" font-weight="700" letter-spacing="2">RAG KNOWLEDGE</text>
    </g>

    <g>
      <circle cx="272" cy="212" r="44" fill="#111a30" stroke="#ff6b6b" stroke-width="3"/>
      <circle cx="272" cy="212" r="8" fill="#ff6b6b"/>
      <text x="332" y="204" fill="#f7f9ff" font-size="20" font-weight="800">API-TEST-FW</text>
      <text x="332" y="228" fill="#efaaaa" font-size="14" font-weight="700" letter-spacing="2">VERIFICATION</text>
    </g>

    <text x="8" y="312" fill="#6f82a8" font-size="13" letter-spacing="1.4">FRAMEWORK  →  KNOWLEDGE  →  VERIFICATION</text>
  </g>

  <rect x="1.5" y="1.5" width="1277" height="417" rx="22.5" fill="none" stroke="#2a3652" stroke-width="3"/>
</svg>
